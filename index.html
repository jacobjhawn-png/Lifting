<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lift Progression</title><style>
:root{--bg:#0b0e12;--panel:#141922;--panel2:#1b2230;--text:#f3f6fb;--muted:#9aa6b6;--line:#293242;--accent:#4f8cff;--good:#4fd18b;--warn:#ffbf5b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:0;font-size:26px}.muted{color:var(--muted)}.tabs{display:flex;gap:8px;overflow:auto;padding:18px 0}.tab,button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:650}.tab.active,.primary{background:var(--accent);border-color:var(--accent);color:white}.grid{display:grid;grid-template-columns:1.45fr .85fr;gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.exercise{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px;margin:10px 0}.exhead{display:flex;justify-content:space-between;gap:10px;align-items:center}.inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}label{font-size:12px;color:var(--muted)}input,select{width:100%;margin-top:5px;padding:10px;border-radius:9px;border:1px solid var(--line);background:#0f141c;color:var(--text);font-size:16px}.coach{font-size:13px;margin-top:9px;color:#cbd4e1}.actions{display:flex;gap:8px;flex-wrap:wrap}.small{padding:7px 10px;font-size:12px}.danger{color:#ff9292}.metric{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:10px 0}.metric:last-child{border:0}.big{font-size:30px;font-weight:800}.positive{color:var(--good)}.empty{padding:20px 0;color:var(--muted)}dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--text);width:min(500px,92vw);padding:20px}dialog::backdrop{background:#0009}.modalgrid{display:grid;gap:12px}.footer{padding:24px 0;color:var(--muted);font-size:12px;text-align:center}@media(max-width:760px){.grid{grid-template-columns:1fr}.inputs{grid-template-columns:1fr 1fr}.inputs label:first-child{grid-column:1/-1}.wrap{padding:14px}}
</style></head><body><main class="wrap"><div class="top"><div><h1>Lift Progression</h1><div class="muted">PPL + Upper/Lower adaptive workout tracker</div></div><div class="actions"><button id="editBtn">Edit movements</button><button id="resetBtn" class="danger">Reset data</button></div></div><div id="tabs" class="tabs"></div><div class="grid"><section class="card"><div class="top"><div><h2 id="title" style="margin:0"></h2><div id="focus" class="muted"></div></div><div id="sessionCount" class="muted"></div></div><div id="list"></div><button id="save" class="primary" style="width:100%;margin-top:10px">Complete workout</button><div id="status" class="muted" style="margin-top:10px"></div></section><aside><section class="card"><b>Progress update</b><div id="progress"></div></section><section class="card" style="margin-top:16px"><b>Next workout</b><div id="next"></div></section></aside></div><div class="footer">Your workout data is stored locally in this browser.</div></main><dialog id="editor"><form method="dialog"><div class="top"><div><b>Edit <span id="editDay"></span></b><div class="muted">Add, rename, reorder, or remove movements.</div></div><button value="cancel">Close</button></div><div id="editList" style="margin-top:14px"></div><div class="actions"><button type="button" id="addEx">+ Add movement</button><button type="button" id="saveEdit" class="primary">Save movements</button></div></form></dialog><script>
const KEY='lift-progression-v1';const defaults={Push:{focus:'Chest · shoulders · triceps',ex:[['Barbell Bench Press',3,6,8],['Incline Dumbbell Press',3,8,10],['Seated Shoulder Press',3,8,10],['Lateral Raise',3,12,15],['Triceps Pressdown',3,10,15]]},Pull:{focus:'Back · rear delts · biceps',ex:[['Barbell Row',3,6,8],['Lat Pulldown',3,8,12],['Seated Cable Row',3,8,12],['Rear Delt Fly',3,12,15],['Dumbbell Curl',3,8,12]]},Legs:{focus:'Quads · hamstrings · glutes · calves',ex:[['Back Squat',3,5,8],['Romanian Deadlift',3,6,10],['Leg Press',3,8,12],['Leg Curl',3,10,15],['Standing Calf Raise',3,10,15]]},Upper:{focus:'Balanced upper-body strength & hypertrophy',ex:[['Bench Press',3,5,8],['Pull-Up / Pulldown',3,6,10],['Incline Dumbbell Press',3,8,12],['Chest-Supported Row',3,8,12],['Lateral Raise',3,12,15]]},Lower:{focus:'Lower-body strength & hypertrophy',ex:[['Back Squat',3,5,8],['Romanian Deadlift',3,6,10],['Bulgarian Split Squat',3,8,12],['Leg Curl',3,10,15],['Calf Raise',3,10,15]]}};
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state)state={plans:structuredClone(defaults),history:[],day:'Push'};const $=s=>document.querySelector(s);function persist(){localStorage.setItem(KEY,JSON.stringify(state))}function latest(name){for(let i=state.history.length-1;i>=0;i--){let e=state.history[i].entries.find(x=>x.name===name);if(e)return e}}function first(name){for(const h of state.history){let e=h.entries.find(x=>x.name===name);if(e)return e}}function e1rm(w,r){return w*(1+r/30)}function advice(ex){let [n,,lo,hi]=ex,p=latest(n);if(!p)return'Establish a baseline today.';if(p.reps>=hi)return`Last: ${p.weight} lb × ${p.reps}. Try ${Math.round((p.weight+5)/5)*5} lb for ${lo}–${hi}.`;if(p.reps<lo)return`Repeat ${p.weight} lb and aim for at least ${lo} reps.`;return`Repeat ${p.weight} lb and beat ${p.reps} reps before increasing load.`}function render(){const p=state.plans[state.day];$('#tabs').innerHTML=Object.keys(state.plans).map(d=>`<button class="tab ${d===state.day?'active':''}" data-day="${d}">${d}</button>`).join('');document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{state.day=b.dataset.day;persist();render()});$('#title').textContent=state.day+' Day';$('#focus').textContent=p.focus;$('#sessionCount').textContent=state.history.filter(x=>x.day===state.day).length+' sessions logged';$('#list').innerHTML=p.ex.map((ex,i)=>{let [n,s,lo,hi]=ex,prev=latest(n);return`<div class="exercise"><div class="exhead"><div><b>${i+1}. ${n}</b><div class="muted">${s} sets · ${lo}–${hi} reps</div></div><span class="muted">${prev?`${prev.weight} × ${prev.reps} last time`:'New'}</span></div><div class="inputs"><label>Weight (lb)<input type="number" min="0" max="2000" step="2.5" data-n="${encodeURIComponent(n)}" data-f="weight" value="${prev?prev.weight:''}"></label><label>Reps<input type="number" min="1" max="100" step="1" data-n="${encodeURIComponent(n)}" data-f="reps"></label><label>Sets completed<input type="number" min="1" max="20" step="1" data-n="${encodeURIComponent(n)}" data-f="sets" value="${s}"></label></div><div class="coach">Coach: ${advice(ex)}</div></div>`}).join('');renderProgress();renderNext()}
function renderNext(){let p=state.plans[state.day];$('#next').innerHTML=p.ex.length?p.ex.map(ex=>`<div class="metric"><span>${ex[0]}</span><span style="max-width:55%;text-align:right" class="muted">${advice(ex)}</span></div>`).join(''):'<div class="empty">Add a movement to this day.</div>'}function renderProgress(){let names=[...new Set(state.history.flatMap(h=>h.entries.map(e=>e.name)))],rows=[];for(const n of names){let a=first(n),b=latest(n);if(a&&b&&a.weight>0&&a.reps>0){let pct=(e1rm(b.weight,b.reps)/e1rm(a.weight,a.reps)-1)*100;if(a!==b)rows.push([n,pct])}}if(!state.history.length){$('#progress').innerHTML='<div class="empty">Complete your first workout to establish your baseline.</div>';return}if(!rows.length){$('#progress').innerHTML='<div class="empty">Baseline established. Repeat movements to unlock progress comparisons.</div>';return}let avg=rows.reduce((a,x)=>a+x[1],0)/rows.length;$('#progress').innerHTML=`<div class="big ${avg>=0?'positive':''}">${avg>=0?'+':''}${avg.toFixed(1)}%</div><div class="muted">average estimated strength vs baseline</div>${rows.slice(-6).map(x=>`<div class="metric"><span>${x[0]}</span><b class="${x[1]>=0?'positive':''}">${x[1]>=0?'+':''}${x[1].toFixed(1)}%</b></div>`).join('')}`}
$('#save').onclick=()=>{let entries=[],bad=false;for(const ex of state.plans[state.day].ex){let n=ex[0],q=encodeURIComponent(n),w=+document.querySelector(`[data-n="${q}"][data-f="weight"]`).value,r=+document.querySelector(`[data-n="${q}"][data-f="reps"]`).value,s=+document.querySelector(`[data-n="${q}"][data-f="sets"]`).value;if(!(w>=0&&r>=1&&s>=1)){bad=true;break}entries.push({name:n,weight:w,reps:r,sets:s})}if(bad){$('#status').textContent='Enter valid weight, reps, and sets for every movement.';return}state.history.push({day:state.day,date:new Date().toISOString(),entries});persist();$('#status').textContent='Workout saved. Recommendations updated.';render()};
function openEditor(){$('#editDay').textContent=state.day;$('#editList').innerHTML=state.plans[state.day].ex.map((x,i)=>editRow(x,i)).join('');$('#editor').showModal()}function editRow(x,i){return`<div class="exercise editrow"><div class="modalgrid"><label>Movement<input class="ename" value="${x[0].replaceAll('&','&amp;').replaceAll('"','&quot;')}"></label><div class="inputs"><label>Sets<input class="esets" type="number" min="1" max="20" value="${x[1]}"></label><label>Min reps<input class="elo" type="number" min="1" max="100" value="${x[2]}"></label><label>Max reps<input class="ehi" type="number" min="1" max="100" value="${x[3]}"></label></div><div class="actions"><button type="button" class="up small">↑ Up</button><button type="button" class="down small">↓ Down</button><button type="button" class="remove small danger">Remove</button></div></div></div>`}$('#editBtn').onclick=openEditor;$('#addEx').onclick=()=>{$('#editList').insertAdjacentHTML('beforeend',editRow(['New Movement',3,8,12],99))};$('#editList').addEventListener('click',e=>{let row=e.target.closest('.editrow');if(!row)return;if(e.target.classList.contains('remove'))row.remove();if(e.target.classList.contains('up')&&row.previousElementSibling)row.parentNode.insertBefore(row,row.previousElementSibling);if(e.target.classList.contains('down')&&row.nextElementSibling)row.parentNode.insertBefore(row.nextElementSibling,row)});$('#saveEdit').onclick=()=>{let ex=[...document.querySelectorAll('.editrow')].map(r=>{let n=r.querySelector('.ename').value.trim()||'Movement',s=Math.max(1,+r.querySelector('.esets').value||3),lo=Math.max(1,+r.querySelector('.elo').value||8),hi=Math.max(lo,+r.querySelector('.ehi').value||12);return[n,s,lo,hi]});state.plans[state.day].ex=ex;persist();$('#editor').close();render()};$('#resetBtn').onclick=()=>{if(confirm('Delete all workout history and custom movements?')){localStorage.removeItem(KEY);state={plans:structuredClone(defaults),history:[],day:'Push'};render()}};render();
</script></body></html>
